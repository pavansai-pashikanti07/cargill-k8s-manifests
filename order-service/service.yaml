apiVersion: v1
kind: Service
metadata:
  name: cargill-order-service
  namespace: supplychain-dev
  labels:
    app.kubernetes.io/name: order-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: order-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: supplychain-dev
data:
  ENVIRONMENT: "dev-eks"
  LOG_LEVEL: "INFO"
  KAFKA_BROKERS: "kafka-cluster.observability.svc.cluster.local:9092"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cargill-order-service-hpa
  namespace: supplychain-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cargill-order-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
