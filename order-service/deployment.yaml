apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargill-order-service
  namespace: supplychain-dev
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: cargill-supplychain
    managed-by: harness-cd
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        # Dynamic image tag replaced by Harness Delegate during deployment:
        image: cargill-docker.jfrog.io/supplychain/order-service:<+input.DOCKER_IMAGE_TAG>
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: order-service-config
              key: ENVIRONMENT
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 2
